<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
<div class="layout">
  <aside class="sidebar">

    <nav class="sidebar-nav">
      <a class="nav-item active" href="/dashboard.html">Dashboard</a>
      <a class="nav-item" href="/exchange.html">Settings</a>

      <a class="nav-item" href="/history.html">Trade History</a>
    </nav>
    <div class="sidebar-footer">
      <section class="sidebar-clock macro-news-panel" aria-labelledby="macroNewsTitle">

    <div class="page-header">

      <div class="header-actions"><span id="userInfo" style="font-family:var(--mono);font-size:12px;color:var(--muted)"></span><span id="headerConnection" class="header-connection is-offline">CONNECTION OFFLINE</span><button id="botToggle" class="bot-toggle" onclick="toggleBot()">BOT OFF</button><span id="botRuntime" class="bot-runtime">LIVE DEMO OFF</span></div>
    </div><section class="market-charts" aria-labelledby="marketChartsTitle"><div class="charts-header"><div><h3 id="marketChartsTitle">MARKET CHARTS</h3><label class="chart-timeframe-picker">TIMEFRAME <select id="chartTimeframe" aria-label="Chart timeframe" onchange="changeChartTimeframe(this.value)"><option value="1h">1H</option><option value="15m" selected>15M</option><option value="5m">5M</option></select></label></div><span id="chartsUpdated" class="muted mono">LIVE --:--:--</span></div><div id="pairCharts" class="pair-charts"></div></section>
        <div class="card workflow-office"><div class="office-header"><div><h3 style="font-size:14px;margin-bottom:6px">V2 WORKFLOW OFFICE</h3></div><span class="office-live"><i></i> LIVE</span></div><div class="workflow-track" id="workflowTrack"></div><p id="v2Status" class="muted mono" style="margin-top:14px">Loading LIVE DEMO workflow status...</p><div id="v2Pairs" class="table-wrap"></div></div><section class="card account-assets" aria-labelledby="accountAssetsTitle"><div class="office-header"><div><h3 id="accountAssetsTitle" style="font-size:14px;margin-bottom:6px">BINANCE DEMO ASSETS</h3></div></div><div id="assetsTable" class="table-wrap"><p class="muted mono">Loading account assets...</p></div></section>
</div>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script>
function csrfToken() { return document.cookie.split('; ').find(x => x.startsWith('csrf='))?.split('=')[1] || ''; }
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (opts.method && opts.method !== 'GET') headers['x-csrf-token'] = csrfToken();
  const r = await fetch('/api' + path, { ...opts, headers });
  if (r.status === 401) { window.location.href = '/'; return null; }
  return r.json();
}

const chartPairs = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XAUUSDT'];
let selectedChartInterval = localStorage.getItem('jev_chart_timeframe') || '15m';
const charts = new Map();
function changeChartTimeframe(interval) {
  if (!['1h', '15m', '5m'].includes(interval)) return;
  selectedChartInterval = interval;
  localStorage.setItem('jev_chart_timeframe', interval);
  charts.forEach(view => view.chart.remove());
  charts.clear();
  document.getElementById('pairCharts').replaceChildren();
  refreshCharts();
}
function chartData(candles) { return candles.map(c => ({ time: Math.floor(c.ts / 1000), open: c.open, high: c.high, low: c.low, close: c.close })); }
function volumeData(candles) { return candles.map(c => ({ time: Math.floor(c.ts / 1000), value: c.volume, color: c.close >= c.open ? '#b8f36b66' : '#ff657566' })); }
function createChart(container) {
  const chart = LightweightCharts.createChart(container, { autoSize: true, handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: true }, handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true }, layout: { background: { color: '#0b141b' }, textColor: '#78909a', fontFamily: 'JetBrains Mono, monospace', fontSize: 9 }, grid: { vertLines: { color: '#1b2a33' }, horzLines: { color: '#1b2a33' } }, rightPriceScale: { borderColor: '#263742', scaleMargins: { top: 0.08, bottom: 0.22 } }, timeScale: { borderColor: '#263742', timeVisible: true, secondsVisible: false, rightOffset: 3 }, crosshair: { mode: LightweightCharts.CrosshairMode.Normal } });
  const candles = chart.addSeries(LightweightCharts.CandlestickSeries, { upColor: '#b6ff00', downColor: '#ff6575', borderVisible: false, wickUpColor: '#b6ff00', wickDownColor: '#ff6575' });
  const volume = chart.addSeries(LightweightCharts.HistogramSeries, { priceFormat: { type: 'volume' }, priceScaleId: '', lastValueVisible: false, priceLineVisible: false });
  volume.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  const structureSvg = document.createElement('svg');
  structureSvg.setAttribute('aria-hidden', 'true');
  structureSvg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible';
  container.style.position = 'relative';
  container.appendChild(structureSvg);
  return { chart, candles, volume, overlays: [], markers: null, structureSvg, structureSeries: [] };
}
async function smcOverlay(view, raw, symbol, interval) {
  view.overlays.forEach(line => view.candles.removePriceLine(line));
  view.overlays = [];
  const structure = await api(`/chart/structure?symbol=${symbol}`);
  if (!structure?.ok || structure.artifact_status !== 'PASS') throw new Error('Authoritative structure unavailable');
  const bars = raw.map(c => ({ ...c, time: Math.floor(c.ts / 1000) }));
  const visuals = structure.structure_visuals || structure.events || [];
  const lastBar = bars[bars.length - 1];
  const chartTime = time => { const value = Number(time); return Number.isFinite(value) ? (value > 1e12 ? Math.floor(value / 1000) : value) : null; };
  const eventBar = event => {
    const exactTime = chartTime(event.event_time);
    return exactTime == null ? null : bars.find(bar => Math.abs(bar.ts - exactTime) <= 60) || null;
  };
  const barAtTime = time => { const exactTime = chartTime(time); return exactTime == null ? null : bars.find(bar => Math.abs(bar.ts - exactTime) <= 60) || null; };
  const sourceBar = event => barAtTime(event.pivot_time || event.source_times?.[0]);
  const svg = view.structureSvg;
  const esc = text => String(text).replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));
  const xFor = time => { const coordinate = view.chart.timeScale().timeToCoordinate(time); return Number.isFinite(coordinate) ? coordinate : null; };
  const yFor = price => { const coordinate = view.candles.priceToCoordinate(Number(price)); return Number.isFinite(coordinate) ? coordinate : null; };
  const visualSvg = [];
  const labelKeys = new Set();
  const selectedVisuals = visuals.filter(event => event.lifecycle_state !== 'INVALIDATED' && event.event_time && (event.event_time >= bars[0].ts && event.event_time <= lastBar.ts)).slice(-16);
  const pushLabel = (x, y, color, text) => {
    const key = `${text}:${Math.round(x / 8)}:${Math.round(y / 8)}`;
    if (labelKeys.has(key)) return;
    labelKeys.add(key);
    visualSvg.push(`<text x="${x}" y="${y}" fill="${color}" font-size="9" font-family="Aquatico,monospace" text-anchor="middle">${text}</text>`);
  };
  (structure.swing_visuals || []).filter(swing => chartTime(swing.time) >= bars[0].ts && chartTime(swing.time) <= lastBar.ts).slice(-24).forEach(swing => {
    const x = xFor(chartTime(swing.time)), y = yFor(swing.price);
    if (Number.isFinite(x) && Number.isFinite(y)) pushLabel(x, y + (swing.kind === 'high' ? -8 : 14), swing.kind === 'high' ? '#F23645' : '#089981', swing.label);
  });
  selectedVisuals.forEach(event => {
    const bar = eventBar(event);
    if (!bar) return;
    const bullish = event.side === 'LONG', color = bullish ? '#089981' : '#F23645';
    if (['BOS', 'CHoCH_MSS'].includes(event.kind) && event.pivot_time && event.break_time && Number.isFinite(Number(event.break_price))) {
      const pivot = barAtTime(event.pivot_time), breakBar = barAtTime(event.break_time);
      const x1=xFor(pivot?.time), x2=xFor(breakBar?.time), y=yFor(event.break_price);
      if ([x1,x2,y].every(Number.isFinite) && x2 > x1) {
        const label = event.kind === 'CHoCH_MSS' ? 'CHoCH' : 'BOS';
        visualSvg.push(`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="1.2"/>`);
        pushLabel((x1+x2)/2, y-5, color, label);
      }
    }
    if (['FVG','ORDER_BLOCK','BREAKER_BLOCK'].includes(event.kind) && event.zone_bounds?.low != null && event.zone_bounds?.high != null) {
      const zoneColor = event.kind === 'FVG' ? (bullish ? '#00b8a9' : '#d85ca8') : color;
      const start = barAtTime(event.source_times?.[0] || event.ob_source_time || event.event_time);
      const x1=xFor(start?.time), x2=xFor(lastBar.time), y1=yFor(event.zone_bounds.high), y2=yFor(event.zone_bounds.low);
      if ([x1,x2,y1,y2].every(Number.isFinite) && x2 > x1 && Math.abs(y2-y1) >= 2) visualSvg.push(`<rect x="${x1}" y="${Math.min(y1,y2)}" width="${x2-x1}" height="${Math.abs(y2-y1)}" fill="${zoneColor}" fill-opacity=".08" stroke="${zoneColor}" stroke-opacity=".45" stroke-width="1"/>`);
    }
    if (event.kind === 'LIQUIDITY_SWEEP' && Number.isFinite(Number(event.sweep_level))) {
      const y=yFor(event.sweep_level), x1=xFor(bar.time), x2=xFor(lastBar.time);
      if ([x1,x2,y].every(Number.isFinite) && x2 > x1) visualSvg.push(`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#D4A72C" stroke-width="1" stroke-dasharray="4 3"/>`);
    }
  });
  svg.setAttribute('viewBox', `0 0 ${svg.clientWidth || 1} ${svg.clientHeight || 1}`);
  svg.innerHTML = visualSvg.join('');
  requestAnimationFrame(() => { svg.setAttribute('viewBox', `0 0 ${svg.clientWidth || 1} ${svg.clientHeight || 1}`); });
  if (view.markers) view.markers.setMarkers([]);
  view.markers = null;
  view.overlays.forEach(line => view.candles.removePriceLine(line)); view.overlays = [];
  const plans = (structure.active_candidates || []).map(candidate => ({
    entry: candidate.entry,
    sl: candidate.sl,
    tp: candidate.tp
  }));
  for (const plan of plans) {
    [['ENTRY', plan.entry, '#ffd166'], ['SL', plan.sl, '#ff6575'], ['TP', plan.tp, '#00fff7']].forEach(([title, value, color]) => {
      if (!Number.isFinite(Number(value))) return;
      const line = view.candles.createPriceLine({ price: Number(value), color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title });
      view.overlays.push(line);
    });
  }
}
let chartsRefreshing = false;
async function refreshCharts() {
  if (chartsRefreshing) return;
  chartsRefreshing = true;
  const root = document.getElementById('pairCharts');
  if (!root.children.length) root.innerHTML = chartPairs.map(symbol => `<article class="pair-chart"><div class="pair-chart-title"><strong>${symbol}</strong><span id="chartState-${symbol}">LOADING</span></div><div class="timeframe-label">${selectedChartInterval.toUpperCase()}</div><div class="chart-host" id="chart-${symbol}-${selectedChartInterval}" role="img" aria-label="${symbol} ${selectedChartInterval} candlestick chart"></div></article>`).join('');
  try {
    const ticker = await api('/chart/tickers');
    if (!ticker?.ok) throw new Error(ticker?.error || 'Ticker unavailable');
    await Promise.all(chartPairs.map(async symbol => {
      const state = document.getElementById(`chartState-${symbol}`);
      try {
        const interval = selectedChartInterval;
        const result = await api(`/chart/candles?symbol=${symbol}&interval=${interval}&limit=120`);
        if (!result?.ok) throw new Error(result?.error || 'Unavailable');
        const key = `${symbol}-${interval}`;
        const view = charts.get(key) || createChart(document.getElementById(`chart-${key}`));
        const visibleRange = view.chart.timeScale().getVisibleLogicalRange();
        view.candles.setData(chartData(result.candles));
        view.volume.setData(volumeData(result.candles));
        if (visibleRange) view.chart.timeScale().setVisibleLogicalRange(visibleRange);
        else view.chart.timeScale().fitContent();
        await smcOverlay(view, result.candles, symbol, interval);
        charts.set(key, view);
        state.textContent = `LIVE ${ticker.prices[symbol]} · ${interval.toUpperCase()}`;
      } catch { state.textContent = 'ERROR'; }
    }));
    document.getElementById('chartsUpdated').textContent = new Date().toLocaleTimeString();
  } finally { chartsRefreshing = false; }
}
async function refreshAssets(){
  const table=document.getElementById('assetsTable');
  try {
    const p=await api('/binance-demo/execution-preflight');
    if(!p?.ok) throw new Error(p?.error||'Unavailable');
    const rows=p.balances||[];
    table.innerHTML=rows.length?'<table><thead><tr><th>ASSET</th><th>WALLET</th><th>AVAILABLE</th><th>UNREALIZED PNL</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${x.asset}</td><td>${Number(x.walletBalance).toFixed(4)}</td><td>${Number(x.availableBalance).toFixed(4)}</td><td class="${x.unrealizedProfit>=0?'pos':'neg'}">${Number(x.unrealizedProfit).toFixed(4)}</td></tr>`).join('')+'</tbody></table>':'<p class="muted mono">No USDT/USDC asset returned</p>';
  } catch(error) { table.innerHTML=`<p class="neg mono">${error.message}</p>`; }
}
const okxTickerPairs = ['ADA-USDT-SWAP','DOGE-USDT-SWAP','XRP-USDT-SWAP','LTC-USDT-SWAP','AVAX-USDT-SWAP','LINK-USDT-SWAP','SUI-USDT-SWAP','DOT-USDT-SWAP','TRX-USDT-SWAP','TON-USDT-SWAP'];
let tickerState = { okx: null };
function renderTradingTicker() {
  const ticker = document.getElementById('userTradingTicker');
  if (!ticker) return;
  const rows = tickerState.okx;
  if (!rows?.length) { ticker.textContent = 'LOADING PAIRS...'; return; }
  const message = rows.map(x => `${x.symbol} ${x.price} ${x.pct}`).join('   ·   ');
  ticker.textContent = `${message}   ·   ${message}`;
}
async function refreshOkxTicker() {
  try {
    const response = await fetch('https://www.okx.ac/api/v5/market/tickers?instType=SWAP', { cache: 'no-store' });
    if (!response.ok) throw new Error('OKX HTTP ' + response.status);
    const payload = await response.json();
    if (payload?.code !== '0' || !Array.isArray(payload.data)) throw new Error('Invalid OKX tickers response');
    const wanted = new Set(okxTickerPairs);
    const results = payload.data.filter(row => wanted.has(row.instId) && Number.isFinite(Number(row.last)) && Number.isFinite(Number(row.open24h))).map(row => {
      const pct = (Number(row.last) - Number(row.open24h)) / Number(row.open24h) * 100;
      return { symbol: row.instId.replace('-USDT-SWAP',''), price: Number(row.last).toLocaleString(undefined, { maximumSignificantDigits: 8 }), pct: `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%` };
    });
    if (!results.length) throw new Error('No requested OKX pairs returned');
    tickerState.okx = results;
    renderTradingTicker();
  } catch {
    if (!tickerState.okx) renderTradingTicker();
  }
}
async function refreshV2() {
  const v2 = await api('/v2/status');
  if (!v2?.ok) return;
  const t = v2.artifact.totals;
  const rooms = [['BIAS BOT','1H','Reads closed 1H candles; sets market direction.',t.bias_ready > 0 ? 'READY' : 'WAITING'],['MARKET STRUCTURE BOT','15M','Builds SMC structure, liquidity, BOS / CHoCH evidence.',t.structure_events > 0 ? 'ANALYZING' : 'WAITING'],['CONFIRMATION BOT','5M','Checks retest, rejection, micro-break, and continuation state.',t.confirmed_5m > 0 ? 'CONFIRMED' : 'WAITING'],['SELECTION BOT','GATE','Routes one causal owner among five peer SetupBots.',(t.selected_events ?? t.selected) > 0 ? 'RESOLVED' : 'WAITING'],['SETUP BOT','PLAN','Owns setup-specific Entry / SL / TP / RR and reasons.',t.live_demo_candidates > 0 ? 'LIVE_DEMO READY' : 'WAITING']];
  const track = document.getElementById('workflowTrack');
  track.replaceChildren();
  rooms.forEach((r,i) => { const room = document.createElement('div'); room.className = 'workflow-room' + (r[3] !== 'WAITING' && r[3] !== 'OFF' ? ' room-active' : ''); room.innerHTML = `<div class="room-top"><span class="room-index">0${i + 1}</span><span class="room-status">${r[3]}</span></div><div class="room-icon">${r[1]}</div><h4>${r[0]}</h4><p>${r[2]}</p>`; if (i < rooms.length - 1) { const connector = document.createElement('span'); connector.className = 'room-connector'; connector.textContent = '›'; room.appendChild(connector); } track.appendChild(room); });
  document.getElementById('v2Status').textContent = `${t.structure_events} structure events · ${t.confirmed_5m} confirmed · ${(t.selected_events ?? t.selected)} resolved`;
  const candleTime = ts => ts ? new Date(Number(ts)).toLocaleTimeString() : '--';
  document.getElementById('v2Pairs').innerHTML = '<table><thead><tr><th>Pair</th><th>1H latest</th><th>15M latest</th><th>5M latest</th><th>Events</th><th>Setup owners</th><th>Active plan</th></tr></thead><tbody>' + Object.entries(v2.artifact.symbols).map(([symbol,x]) => { const setups=[...new Set((x.recent_events||[]).map(e=>e.selected_setup).filter(Boolean))]; const eligible=[...new Set((x.recent_events||[]).flatMap(e=>e.eligible_setup_candidates||[]))]; return `<tr><td>${symbol}</td><td>${candleTime(x.latest_closed_candle?.['1h'])}</td><td>${candleTime(x.latest_closed_candle?.['15m'])}</td><td>${candleTime(x.latest_closed_candle?.['5m'])}</td><td>${x.recent_events.length}</td><td class="mono">${setups.length ? setups.join(', ') : '—'}</td><td>${v2.artifact.active_plan_by_symbol?.[symbol]?.client_order_id ? 'ACTIVE' : '—'} <span class="muted mono">(${v2.artifact.latest_confirmed_structure_event_ids?.[symbol] || '—'})</span></td></tr>`; }).join('') + '</tbody></table>';
}
async function init() {
  const me = await api('/me');
  if (!me) return;
  document.getElementById('userInfo').textContent = me.username;

  const bot = await api('/bot/status');
  if (bot?.ok) renderBot(bot);
  await refreshV2();
  const keys = await api('/keys');
  if (keys) {
    const online = keys.some(k => k.status === 'connected');
    const conn = document.getElementById('headerConnection');
    conn.textContent = online ? 'CONNECTION ONLINE' : 'CONNECTION OFFLINE';
    conn.classList.toggle('is-online', online);
    conn.classList.toggle('is-offline', !online);
  }
}

async function refreshBot() {
  const bot = await api('/bot/status');
  if (bot?.ok) {
    renderBot(bot);
  }
}function renderBot(bot) {
  const button = document.getElementById('botToggle');
  button.textContent = bot.enabled ? 'BOT ON' : 'BOT OFF';
  button.classList.toggle('bot-enabled', bot.enabled);
  button.setAttribute('aria-pressed', String(bot.enabled));
  const execution = bot.demoExecution?.status ? ` · Live Demo ${bot.demoExecution.status}` : '';
  const stream = bot.marketStream?.connected ? ' · WS CONNECTED' : ' · WS OFFLINE';
    button.title = bot.running ? `Live Demo cycle running · ${bot.cycles} completed${execution}${stream}` : (bot.error || (bot.enabled ? `Live Demo bot ready${execution}${stream}` : 'Trading bot stopped'));
    const runtime = document.getElementById('botRuntime');
    runtime.textContent = bot.running ? `LIVE DEMO RUNNING · ${bot.cycles}` : bot.enabled ? `LIVE DEMO ON · ${bot.cycles} CYCLES` : bot.observing ? 'LIVE DEMO OBSERVER ON · BOT OFF' : 'LIVE DEMO OFF';
  runtime.classList.toggle('bot-runtime-error', Boolean(bot.error && bot.enabled));
}
async function toggleBot() {
  const current = document.getElementById('botToggle').classList.contains('bot-enabled');
  const result = await api('/bot/toggle', { method: 'POST', body: JSON.stringify({ enabled: !current }) });
  if (result?.ok) renderBot(result);
}
async function logout() {
  await api('/logout', { method: 'POST' });
  window.location.href = '/';
}

init();
refreshOkxTicker();
setInterval(refreshOkxTicker, 10_000);
refreshCharts();
refreshAssets();
setInterval(refreshAssets, 30_000);
setInterval(refreshCharts, 30_000);
setInterval(refreshBot, 60_000);
setInterval(refreshV2, 5_000);
const macroNewsUrl = '/macro-news';
function escapeHtml(value) { return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
function renderMacroNews(events, fetchedAt) {
  const state = document.getElementById('macroNewsState');
  const list = document.getElementById('macroNewsList');
  if (!state || !list) return;
  const upcoming = events.filter(event => { const ts = Date.parse(event.time_utc); return Number.isFinite(ts) && ts >= Date.now() && ts <= Date.now() + 48 * 3600000; });
  state.textContent = '';
  state.className = 'macro-news-state' + (events.length ? ' has-events' : '');
  list.innerHTML = upcoming.length ? upcoming.slice(0, 3).map(event => {
    const date = new Date(event.time_utc);
    const when = Number.isNaN(date.getTime()) ? 'TIME UNVERIFIED' : new Intl.DateTimeFormat(undefined, { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZoneName: 'short' }).format(date);
    const actual = event.actual ?? '—';
    return `<article class="macro-news-event"><strong>${escapeHtml(event.title || 'Unnamed event')}</strong><span>${escapeHtml(when)}</span><small>${escapeHtml('CURRENCY ' + (event.currency || 'SOURCE NOT PROVIDED'))} · ${escapeHtml('IMPACT ' + (event.impact || 'SOURCE NOT PROVIDED'))}</small><small>${escapeHtml(event.forecast != null ? 'FCST ' + event.forecast : 'FCST —')} · ${escapeHtml(event.previous != null ? 'PREV ' + event.previous : 'PREV —')} · ${escapeHtml('ACTUAL ' + actual)}</small><small>${escapeHtml(event.source_name || 'SOURCE —')} · ${escapeHtml(event.data_status || 'STATUS —')}</small></article>`;
  }).join('') : '<p class="macro-news-empty">No verified high-impact releases in next 7 days.</p>';
  state.title = 'Updated ' + new Date(fetchedAt).toLocaleTimeString();
}
async function refreshMacroNews() {
  const state = document.getElementById('macroNewsState');
  try {
    const response = await fetch(macroNewsUrl, { headers: { accept: 'application/json' }, signal: AbortSignal.timeout(8_000) });
    const payload = await response.json();
    if (!response.ok || !Array.isArray(payload.events)) throw new Error('Calendar unavailable');
    renderMacroNews(payload.events, Date.now());
  } catch {
    if (state) { state.textContent = 'DATA UNAVAILABLE'; state.className = 'macro-news-state is-error'; }
    const list = document.getElementById('macroNewsList');
    if (list) list.innerHTML = '<p class="macro-news-empty">Source unavailable. No event assumption made.</p>';
  }
}
refreshMacroNews();
setInterval(refreshMacroNews, 15 * 60_000);
setInterval(() => { const el = document.getElementById('chartsUpdated'); if (el) el.textContent = new Date().toLocaleTimeString(); }, 1_000);
</script>
