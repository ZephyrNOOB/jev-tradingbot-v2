<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEV - Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">JEV<span class="emerald">.</span>BOT</div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="/dashboard.html">Dashboard</a>
      <a class="nav-item" href="/exchange.html">Settings</a>

      <a class="nav-item" href="/history.html">Trade History</a>
    </nav>
    <div class="sidebar-footer">
      <button onclick="logout()">LOGOUT</button>
    </div>
  </aside>
  <main class="main">
    <div class="page-header">
      <h2 class="page-title">DASHBOARD</h2>
      <div class="header-actions"><span id="userInfo" style="font-family:var(--mono);font-size:12px;color:var(--muted)"></span><span id="headerConnection" class="header-connection is-offline">CONNECTION OFFLINE</span><button id="botToggle" class="bot-toggle" onclick="toggleBot()">BOT OFF</button><span id="botRuntime" class="bot-runtime">PAPER STOPPED</span></div>
    </div>

    <section class="market-charts" aria-labelledby="marketChartsTitle"><div class="charts-header"><div><h3 id="marketChartsTitle">LIVE MARKET CHARTS</h3><p class="muted mono">5M closed candles · read-only observer · refresh 5s</p></div><span id="chartsUpdated" class="muted mono">LIVE --:--:--</span></div><div id="pairCharts" class="pair-charts"></div></section>
    <div class="card workflow-office"><div class="office-header"><div><h3 style="font-size:14px;margin-bottom:6px">V2 WORKFLOW OFFICE</h3><p class="muted mono">Read-only paper execution monitor · orders disabled</p></div><span class="office-live"><i></i> PAPER MODE</span></div><div class="workflow-track" id="workflowTrack"></div><p id="v2Status" class="muted mono" style="margin-top:14px">Loading paper status...</p><div id="v2Pairs" class="table-wrap"></div></div>
</div>
<script>
function csrfToken() { return document.cookie.split('; ').find(x => x.startsWith('csrf='))?.split('=')[1] || ''; }
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (opts.method && opts.method !== 'GET') headers['x-csrf-token'] = csrfToken();
  const r = await fetch('/api' + path, { ...opts, headers });
  if (r.status === 401) { window.location.href = '/'; return null; }
  return r.json();
}

const chartPairs = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XAUUSDT'];
function drawChart(canvas, candles, livePrice) {
  const ctx = canvas.getContext('2d'), ratio = devicePixelRatio || 1, width = canvas.clientWidth, height = canvas.clientHeight;
  canvas.width = width * ratio; canvas.height = height * ratio; ctx.scale(ratio, ratio);
  const prices = candles.flatMap(c => [c.high, c.low]).concat(livePrice), max = Math.max(...prices), min = Math.min(...prices), range = max - min || 1;
  ctx.clearRect(0, 0, width, height); ctx.strokeStyle = '#00d992'; ctx.lineWidth = 1.2; ctx.beginPath();
  candles.forEach((c, i) => { const x = i * width / Math.max(1, candles.length - 1), y = height - ((c.close - min) / range) * (height - 10) - 5; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
  const liveY = height - ((livePrice - min) / range) * (height - 10) - 5; ctx.strokeStyle = '#f2b84b'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(0, liveY); ctx.lineTo(width, liveY); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#6b6966'; ctx.font = '10px monospace'; ctx.fillText(max.toFixed(2), 8, 12); ctx.fillText(min.toFixed(2), 8, height - 4); ctx.fillStyle = '#f2b84b'; ctx.fillText(`LIVE ${livePrice}`, Math.max(8, width - 90), 12);
}
let chartsRefreshing = false;
async function refreshCharts() {
  if (chartsRefreshing) return;
  chartsRefreshing = true;
  const root = document.getElementById('pairCharts');
  if (!root.children.length) root.innerHTML = chartPairs.map(symbol => `<article class="pair-chart"><div class="pair-chart-title"><strong>${symbol}</strong><span id="chartState-${symbol}">LOADING</span></div><canvas id="chart-${symbol}" aria-label="${symbol} 5 minute price chart"></canvas></article>`).join('');
  try {
    const ticker = await api('/chart/tickers');
    if (!ticker?.ok) throw new Error(ticker?.error || 'Ticker unavailable');
    await Promise.all(chartPairs.map(async symbol => { const state = document.getElementById(`chartState-${symbol}`); try { const result = await api(`/chart/candles?symbol=${symbol}&interval=5m&limit=120`); if (!result?.ok) throw new Error(result?.error || 'Unavailable'); drawChart(document.getElementById(`chart-${symbol}`), result.candles, ticker.prices[symbol]); state.textContent = `LIVE ${ticker.prices[symbol]} · ${result.candles.length} CANDLES`; } catch { state.textContent = 'ERROR'; } }));
    document.getElementById('chartsUpdated').textContent = `LIVE ${new Date().toLocaleTimeString()}`;
  } finally { chartsRefreshing = false; }
}
async function init() {
  const me = await api('/me');
  if (!me) return;
  document.getElementById('userInfo').textContent = me.username;
  const bot = await api('/bot/status');
  if (bot?.ok) renderBot(bot);
  const v2 = await api('/v2/status');
  if (v2?.ok) {
    const t = v2.artifact.totals;
    const rooms = [['BIAS BOT','1H','Reads closed 1H candles; sets market direction.',t.bias_ready > 0 ? 'READY' : 'WAITING'],['MARKET STRUCTURE BOT','15M','Builds SMC structure and emits BOS / CHoCH evidence.',t.structure_events > 0 ? 'ANALYZING' : 'WAITING'],['CONFIRMATION BOT','5M','Checks retest, rejection, and micro-break confirmation.',t.confirmed_5m > 0 ? 'CONFIRMED' : 'WAITING'],['SELECTION BOT','GATE','Accepts only bias-aligned, causally owned setups.',t.selected > 0 ? 'SELECTED' : 'WAITING'],['SETUP BOT','PLAN','Builds virtual Entry / SL / TP with provenance and economics.',t.paper_plans > 0 ? 'PAPER READY' : 'WAITING']];
    const track = document.getElementById('workflowTrack');
    rooms.forEach((r,i) => { const room = document.createElement('div'); room.className = 'workflow-room' + (r[3] !== 'WAITING' ? ' room-active' : ''); room.innerHTML = `<div class="room-top"><span class="room-index">0${i + 1}</span><span class="room-status">${r[3]}</span></div><div class="room-icon">${r[1]}</div><h4>${r[0]}</h4><p>${r[2]}</p>`; if (i < rooms.length - 1) { const connector = document.createElement('span'); connector.className = 'room-connector'; connector.textContent = '›'; room.appendChild(connector); } track.appendChild(room); });
    document.getElementById('v2Status').textContent = `Demo paper · ${t.structure_events} structure events · ${t.confirmed_5m} confirmed · ${t.selected} selected · orders disabled`;
    document.getElementById('v2Pairs').innerHTML = '<table><thead><tr><th>Pair</th><th>Events</th><th>Plans</th></tr></thead><tbody>' + Object.entries(v2.artifact.symbols).map(([s,x]) => `<tr><td>${s}</td><td>${x.recent_events.length}</td><td>${x.recent_events.filter(e => e.virtual_entry_sl_tp).length}</td></tr>`).join('') + '</tbody></table>';
  }
  const keys = await api('/keys');
  if (keys) {
    const online = keys.some(k => k.status === 'connected');
    const conn = document.getElementById('headerConnection');
    conn.textContent = online ? 'CONNECTION ONLINE' : 'CONNECTION OFFLINE';
    conn.classList.toggle('is-online', online);
    conn.classList.toggle('is-offline', !online);
  }
}

async function refreshBot() {
  const bot = await api('/bot/status');
  if (bot?.ok) renderBot(bot);
}function renderBot(bot) {
  const button = document.getElementById('botToggle');
  button.textContent = bot.enabled ? 'BOT ON' : 'BOT OFF';
  button.classList.toggle('bot-enabled', bot.enabled);
  button.setAttribute('aria-pressed', String(bot.enabled));
  button.title = bot.running ? `Paper cycle running · ${bot.cycles} completed` : (bot.error || (bot.enabled ? 'Paper runner starting' : 'Paper runner stopped'));
  const runtime = document.getElementById('botRuntime');
  runtime.textContent = bot.error ? 'PAPER ERROR' : bot.running ? `PAPER RUNNING · ${bot.cycles}` : bot.enabled ? `PAPER ON · ${bot.cycles} CYCLES` : 'PAPER STOPPED';
  runtime.classList.toggle('bot-runtime-error', Boolean(bot.error));
}
async function toggleBot() {
  const current = document.getElementById('botToggle').classList.contains('bot-enabled');
  const result = await api('/bot/toggle', { method: 'POST', body: JSON.stringify({ enabled: !current }) });
  if (result?.ok) renderBot(result);
}
async function logout() {
  await api('/logout', { method: 'POST' });
  window.location.href = '/';
}

init();
refreshCharts();
setInterval(refreshCharts, 5_000);
setInterval(refreshBot, 60_000);
setInterval(() => { const el = document.getElementById('chartsUpdated'); if (el) el.textContent = `LIVE ${new Date().toLocaleTimeString()}`; }, 1_000);
</script>
</body>
</html>
