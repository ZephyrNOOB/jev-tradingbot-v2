<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEV - Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">JEV<span class="emerald">.</span>BOT</div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="/dashboard.html">Dashboard</a>
      <a class="nav-item" href="/exchange.html">Settings</a>

      <a class="nav-item" href="/history.html">Trade History</a>
    </nav>
    <div class="sidebar-footer">
      <button onclick="logout()">LOGOUT</button>
    </div>
  </aside>
  <main class="main">
    <div class="page-header">
      <h2 class="page-title">DASHBOARD</h2>
      <div class="header-actions"><span id="userInfo" style="font-family:var(--mono);font-size:12px;color:var(--muted)"></span><span id="headerConnection" class="header-connection is-offline">CONNECTION OFFLINE</span><button id="botToggle" class="bot-toggle" onclick="toggleBot()">BOT OFF</button><span id="botRuntime" class="bot-runtime">LIVE DEMO OFF</span></div>
    </div><section class="market-charts" aria-labelledby="marketChartsTitle"><div class="charts-header"><div><h3 id="marketChartsTitle">LIVE MARKET CHARTS</h3><label class="chart-timeframe-picker">TIMEFRAME <select id="chartTimeframe" aria-label="Chart timeframe" onchange="changeChartTimeframe(this.value)"><option value="1h">1H</option><option value="15m" selected>15M</option><option value="5m">5M</option></select></label></div><span id="chartsUpdated" class="muted mono">LIVE --:--:--</span></div><div id="pairCharts" class="pair-charts"></div></section>
        <div class="card workflow-office"><div class="office-header"><div><h3 style="font-size:14px;margin-bottom:6px">V2 WORKFLOW OFFICE</h3></div><span class="office-live"><i></i> LIVE DEMO MODE</span></div><div class="workflow-track" id="workflowTrack"></div><p id="v2Status" class="muted mono" style="margin-top:14px">Loading LIVE DEMO workflow status...</p><div id="v2Pairs" class="table-wrap"></div></div><section class="card account-assets" aria-labelledby="accountAssetsTitle"><div class="office-header"><div><h3 id="accountAssetsTitle" style="font-size:14px;margin-bottom:6px">BINANCE DEMO ASSETS</h3></div></div><div id="assetsTable" class="table-wrap"><p class="muted mono">Loading account assets...</p></div></section>
</div>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script>
function csrfToken() { return document.cookie.split('; ').find(x => x.startsWith('csrf='))?.split('=')[1] || ''; }
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (opts.method && opts.method !== 'GET') headers['x-csrf-token'] = csrfToken();
  const r = await fetch('/api' + path, { ...opts, headers });
  if (r.status === 401) { window.location.href = '/'; return null; }
  return r.json();
}

const chartPairs = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT', 'XAUUSDT'];
let selectedChartInterval = localStorage.getItem('jev_chart_timeframe') || '15m';
const charts = new Map();
function changeChartTimeframe(interval) {
  if (!['1h', '15m', '5m'].includes(interval)) return;
  selectedChartInterval = interval;
  localStorage.setItem('jev_chart_timeframe', interval);
  charts.forEach(view => view.chart.remove());
  charts.clear();
  document.getElementById('pairCharts').replaceChildren();
  refreshCharts();
}
function chartData(candles) { return candles.map(c => ({ time: Math.floor(c.ts / 1000), open: c.open, high: c.high, low: c.low, close: c.close })); }
function volumeData(candles) { return candles.map(c => ({ time: Math.floor(c.ts / 1000), value: c.volume, color: c.close >= c.open ? '#00d99266' : '#f2364566' })); }
function createChart(container) {
  const chart = LightweightCharts.createChart(container, { autoSize: true, handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: true }, handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: true }, layout: { background: { color: '#080b0a' }, textColor: '#8f9692', fontFamily: 'JetBrains Mono, monospace', fontSize: 9 }, grid: { vertLines: { color: '#18201d' }, horzLines: { color: '#18201d' } }, rightPriceScale: { borderColor: '#3d3a39', scaleMargins: { top: 0.08, bottom: 0.22 } }, timeScale: { borderColor: '#3d3a39', timeVisible: true, secondsVisible: false, rightOffset: 3 }, crosshair: { mode: LightweightCharts.CrosshairMode.Normal } });
  const candles = chart.addSeries(LightweightCharts.CandlestickSeries, { upColor: '#00d992', downColor: '#f23645', borderVisible: false, wickUpColor: '#00d992', wickDownColor: '#f23645' });
  const volume = chart.addSeries(LightweightCharts.HistogramSeries, { priceFormat: { type: 'volume' }, priceScaleId: '', lastValueVisible: false, priceLineVisible: false });
  volume.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  return { chart, candles, volume, overlays: [], markers: null };
}
async function smcOverlay(view, raw, symbol, interval) {
  view.overlays.forEach(line => view.candles.removePriceLine(line));
  view.overlays = [];
  const structure = await api(`/chart/structure?symbol=${symbol}`);
  if (!structure?.ok || structure.artifact_status !== 'PASS') throw new Error('Authoritative structure unavailable');
  const bars = raw.map(c => ({ ...c, time: Math.floor(c.ts / 1000) }));
  const markerTimes = bars.map(c => c.time);
  const markers = [];
  const indexFromId = eventId => {
    const match = String(eventId || '').match(/^(?:15m:)?(\d+):/);
    return match ? Number(match[1]) : null;
  };
  structure.events.forEach(event => {
    const index = indexFromId(event.event_id);
    if (index === null || !['BOS', 'CHoCH_MSS'].includes(event.kind)) return;
    const offset = index - (structure.latest_closed_candle[interval] ? bars.length - 1 : 0);
    const bar = bars[index] || bars[Math.max(0, Math.min(bars.length - 1, offset))];
    if (!bar) return;
    const bullish = event.side === 'LONG';
    markers.push({ time: bar.time, position: bullish ? 'belowBar' : 'aboveBar', color: bullish ? '#00d992' : '#f23645', shape: bullish ? 'arrowUp' : 'arrowDown', text: event.kind === 'CHoCH_MSS' ? 'CHoCH' : 'BOS' });
  });
  if (view.markers) view.markers.setMarkers([]);
  view.markers = LightweightCharts.createSeriesMarkers(view.candles, markers.slice(-40));
  const plans = (structure.active_candidates || []).map(candidate => ({
    entry: candidate.entry,
    sl: candidate.sl,
    tp: candidate.tp
  }));
  for (const plan of plans) {
    [['ENTRY', plan.entry, '#f2b84b'], ['SL', plan.sl, '#f23645'], ['TP', plan.tp, '#00d992']].forEach(([title, value, color]) => {
      if (!Number.isFinite(Number(value))) return;
      const line = view.candles.createPriceLine({ price: Number(value), color, lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title });
      view.overlays.push(line);
    });
  }
}
let chartsRefreshing = false;
async function refreshCharts() {
  if (chartsRefreshing) return;
  chartsRefreshing = true;
  const root = document.getElementById('pairCharts');
  if (!root.children.length) root.innerHTML = chartPairs.map(symbol => `<article class="pair-chart"><div class="pair-chart-title"><strong>${symbol}</strong><span id="chartState-${symbol}">LOADING</span></div><div class="timeframe-label">${selectedChartInterval.toUpperCase()}</div><div class="chart-host" id="chart-${symbol}-${selectedChartInterval}" role="img" aria-label="${symbol} ${selectedChartInterval} candlestick chart"></div></article>`).join('');
  try {
    const ticker = await api('/chart/tickers');
    if (!ticker?.ok) throw new Error(ticker?.error || 'Ticker unavailable');
    await Promise.all(chartPairs.map(async symbol => {
      const state = document.getElementById(`chartState-${symbol}`);
      try {
        const interval = selectedChartInterval;
        const result = await api(`/chart/candles?symbol=${symbol}&interval=${interval}&limit=120`);
        if (!result?.ok) throw new Error(result?.error || 'Unavailable');
        const key = `${symbol}-${interval}`;
        const view = charts.get(key) || createChart(document.getElementById(`chart-${key}`));
        const visibleRange = view.chart.timeScale().getVisibleLogicalRange();
        view.candles.setData(chartData(result.candles));
        view.volume.setData(volumeData(result.candles));
        await smcOverlay(view, result.candles, symbol, interval);
        if (visibleRange) view.chart.timeScale().setVisibleLogicalRange(visibleRange);
        else view.chart.timeScale().fitContent();
        charts.set(key, view);
        state.textContent = `LIVE ${ticker.prices[symbol]} · ${interval.toUpperCase()}`;
      } catch { state.textContent = 'ERROR'; }
    }));
    document.getElementById('chartsUpdated').textContent = `LIVE ${new Date().toLocaleTimeString()}`;
  } finally { chartsRefreshing = false; }
}
async function refreshAssets(){
  const table=document.getElementById('assetsTable');
  try {
    const p=await api('/binance-demo/execution-preflight');
    if(!p?.ok) throw new Error(p?.error||'Unavailable');
    const rows=p.balances||[];
    table.innerHTML=rows.length?'<table><thead><tr><th>ASSET</th><th>WALLET</th><th>AVAILABLE</th><th>UNREALIZED PNL</th></tr></thead><tbody>'+rows.map(x=>`<tr><td>${x.asset}</td><td>${Number(x.walletBalance).toFixed(4)}</td><td>${Number(x.availableBalance).toFixed(4)}</td><td class="${x.unrealizedProfit>=0?'pos':'neg'}">${Number(x.unrealizedProfit).toFixed(4)}</td></tr>`).join('')+'</tbody></table>':'<p class="muted mono">No USDT/USDC asset returned</p>';
  } catch(error) { table.innerHTML=`<p class="neg mono">${error.message}</p>`; }
}
async function refreshV2() {
  const v2 = await api('/v2/status');
  if (!v2?.ok) return;
  const t = v2.artifact.totals;
  const rooms = [['BIAS BOT','1H','Reads closed 1H candles; sets market direction.',t.bias_ready > 0 ? 'READY' : 'WAITING'],['MARKET STRUCTURE BOT','15M','Builds SMC structure and emits BOS / CHoCH evidence.',t.structure_events > 0 ? 'ANALYZING' : 'WAITING'],['CONFIRMATION BOT','5M','Checks retest, rejection, and micro-break confirmation.',t.confirmed_5m > 0 ? 'CONFIRMED' : 'WAITING'],['SELECTION BOT','GATE','Accepts only bias-aligned, causally owned setups.',t.selected > 0 ? 'SELECTED' : 'WAITING'],['SETUP BOT','PLAN','Builds virtual Entry / SL / TP with provenance and economics.',t.live_demo_candidates > 0 ? 'LIVE_DEMO READY' : 'WAITING']];
  const track = document.getElementById('workflowTrack');
  track.replaceChildren();
  rooms.forEach((r,i) => { const room = document.createElement('div'); room.className = 'workflow-room' + (r[3] !== 'WAITING' && r[3] !== 'OFF' ? ' room-active' : ''); room.innerHTML = `<div class="room-top"><span class="room-index">0${i + 1}</span><span class="room-status">${r[3]}</span></div><div class="room-icon">${r[1]}</div><h4>${r[0]}</h4><p>${r[2]}</p>`; if (i < rooms.length - 1) { const connector = document.createElement('span'); connector.className = 'room-connector'; connector.textContent = '›'; room.appendChild(connector); } track.appendChild(room); });
  document.getElementById('v2Status').textContent = `Demo · ${t.structure_events} structure events · ${t.confirmed_5m} confirmed · ${t.selected} selected`;
  const candleTime = ts => ts ? new Date(Number(ts)).toLocaleTimeString() : '--';
  document.getElementById('v2Pairs').innerHTML = '<table><thead><tr><th>Pair</th><th>1H latest</th><th>15M latest</th><th>5M latest</th><th>Events</th><th>Active plan</th></tr></thead><tbody>' + Object.entries(v2.artifact.symbols).map(([symbol,x]) => `<tr><td>${symbol}</td><td>${candleTime(x.latest_closed_candle?.['1h'])}</td><td>${candleTime(x.latest_closed_candle?.['15m'])}</td><td>${candleTime(x.latest_closed_candle?.['5m'])}</td><td>${x.recent_events.length}</td><td>${v2.artifact.active_plan_by_symbol?.[symbol]?.client_order_id ? 'ACTIVE' : '—'} <span class="muted mono">(${v2.artifact.latest_confirmed_structure_event_ids?.[symbol] || '—'})</span></td></tr>`).join('') + '</tbody></table>';
}
async function init() {
  const me = await api('/me');
  if (!me) return;
  document.getElementById('userInfo').textContent = me.username;

  const bot = await api('/bot/status');
  if (bot?.ok) renderBot(bot);
  await refreshV2();
  const keys = await api('/keys');
  if (keys) {
    const online = keys.some(k => k.status === 'connected');
    const conn = document.getElementById('headerConnection');
    conn.textContent = online ? 'CONNECTION ONLINE' : 'CONNECTION OFFLINE';
    conn.classList.toggle('is-online', online);
    conn.classList.toggle('is-offline', !online);
  }
}

async function refreshBot() {
  const bot = await api('/bot/status');
  if (bot?.ok) renderBot(bot);
}function renderBot(bot) {
  const button = document.getElementById('botToggle');
  button.textContent = bot.enabled ? 'BOT ON' : 'BOT OFF';
  button.classList.toggle('bot-enabled', bot.enabled);
  button.setAttribute('aria-pressed', String(bot.enabled));
  const execution = bot.demoExecution?.status ? ` · Live Demo ${bot.demoExecution.status}` : '';
  const stream = bot.marketStream?.connected ? ' · WS CONNECTED' : ' · WS OFFLINE';
    button.title = bot.running ? `Live Demo cycle running · ${bot.cycles} completed${execution}${stream}` : (bot.error || (bot.enabled ? `Live Demo bot ready${execution}${stream}` : 'Trading bot stopped'));
    const runtime = document.getElementById('botRuntime');
    runtime.textContent = bot.running ? `LIVE DEMO RUNNING · ${bot.cycles}` : bot.enabled ? `LIVE DEMO ON · ${bot.cycles} CYCLES` : bot.observing ? 'LIVE DEMO OBSERVER ON · BOT OFF' : 'LIVE DEMO OFF';
  runtime.classList.toggle('bot-runtime-error', Boolean(bot.error && bot.enabled));
}
async function toggleBot() {
  const current = document.getElementById('botToggle').classList.contains('bot-enabled');
  const result = await api('/bot/toggle', { method: 'POST', body: JSON.stringify({ enabled: !current }) });
  if (result?.ok) renderBot(result);
}
async function logout() {
  await api('/logout', { method: 'POST' });
  window.location.href = '/';
}

init();
refreshCharts();
refreshAssets();
setInterval(refreshAssets, 30_000);
setInterval(refreshCharts, 30_000);
setInterval(refreshBot, 60_000);
setInterval(refreshV2, 5_000);
setInterval(() => { const el = document.getElementById('chartsUpdated'); if (el) el.textContent = `LIVE ${new Date().toLocaleTimeString()}`; }, 1_000);
</script>
</body>
</html>
