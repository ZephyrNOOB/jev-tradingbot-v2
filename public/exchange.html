<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JEV - Settings</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="layout"><aside class="sidebar"><div class="sidebar-brand">JEV<span class="emerald">.</span>BOT</div><nav class="sidebar-nav"><a class="nav-item" href="/dashboard.html">Dashboard</a><a class="nav-item active" href="/exchange.html">Settings</a><a class="nav-item" href="/history.html">Trade History</a></nav><div class="sidebar-footer"><button onclick="logout()">LOGOUT</button></div></aside>
<main class="main"><div class="page-header"><h2 class="page-title">EXCHANGE CONNECTION</h2><span id="userInfo" style="font:12px var(--mono);color:var(--muted)"></span></div>
<div class="card"><h3 style="font-size:14px;margin-bottom:14px">CONNECT EXCHANGE API</h3><p style="font:11px var(--mono);color:var(--muted);margin-bottom:16px">Credential is verified server-side before encrypted storage. Secret never returns to browser.</p><div class="form-row"><div class="field"><label>Exchange</label><select id="exchange" onchange="togglePassphrase()"><option value="okx">OKX</option><option value="binance">Binance Futures</option></select></div><div class="field"><label>API Key</label><input id="apiKey" type="text" autocomplete="off"></div><div class="field"><label>Secret Key</label><input id="secretKey" type="password" autocomplete="new-password"></div><div class="field"><label>Passphrase</label><input id="passphrase" type="password" autocomplete="new-password"></div><div class="field"><label>Label</label><input id="keyLabel" value="default" maxlength="64"></div><button onclick="saveKey()" style="height:38px;margin-top:auto">CONNECT</button></div><p id="apiStatus" style="font:11px var(--mono);margin-top:12px;min-height:16px"></p></div>
<div class="card"><h3 style="font-size:14px;margin-bottom:14px">SAVED CONNECTIONS</h3><div id="keysList" class="table-wrap"></div></div><div class="card"><h3 style="font-size:14px;margin-bottom:14px">BINANCE DEMO ORDER TEST</h3><p style="font:11px var(--mono);color:var(--muted);margin-bottom:12px">BTCUSDT only · LIMIT BUY · cancel immediately · max notional 250 USDT.</p><button id="demoOrderTest" onclick="demoOrderTest()" style="width:auto">TEST ORDER + CANCEL</button><p id="demoOrderStatus" style="font:11px var(--mono);margin-top:12px;min-height:16px"></p></div>
</main></div>
<script>
document.getElementById('exchange')?.insertAdjacentHTML('beforeend','<option value="binanceTestnet">Binance Futures Demo</option>');
function csrfToken(){return document.cookie.split('; ').find(x=>x.startsWith('csrf='))?.split('=')[1]||'';}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(opts.method&&opts.method!=='GET')headers['x-csrf-token']=csrfToken();const r=await fetch('/api'+path,{...opts,headers});if(r.status===401){location.href='/';return null;}return r.json();}
async function init(){const me=await api('/me');if(!me)return;userInfo.textContent=me.username;loadKeys();togglePassphrase();}
function togglePassphrase(){const b=exchange.value==='binance'||exchange.value==='binanceTestnet';passphrase.disabled=b;passphrase.placeholder=b?'Not used by Binance':'Passphrase';}
async function saveKey(){const ex=exchange.value, status=apiStatus;const body={exchange:ex,apiKey:apiKey.value.trim(),secretKey:secretKey.value.trim(),passphrase:passphrase.value.trim(),label:keyLabel.value.trim()||'default'};if(!body.apiKey||!body.secretKey||(ex==='okx'&&!body.passphrase)){status.style.color='var(--red)';status.textContent='Required fields missing';return;}status.style.color='var(--muted)';status.textContent='Verifying with exchange...';const r=await api('/keys',{method:'POST',body:JSON.stringify(body)});if(r?.ok&&r.status==='connected'){status.style.color='var(--emerald)';status.textContent=ex.toUpperCase()+' connected — permission verified';apiKey.value='';secretKey.value='';passphrase.value='';loadKeys();}else{status.style.color='var(--red)';status.textContent=(r?.error||'Exchange rejected credential');}}
async function loadKeys(){const rows=await api('/keys');if(!rows)return;if(!rows.length){keysList.innerHTML='<p style="font:12px var(--mono);color:var(--muted)">No verified connections</p>';return;}keysList.innerHTML='<table><thead><tr><th>Exchange</th><th>Label</th><th>Status</th><th>Verified</th><th>Action</th></tr></thead><tbody>'+rows.map(k=>'<tr><td>'+String(k.exchange).toUpperCase()+'</td><td>'+esc(k.label)+'</td><td class="'+(k.status==='connected'?'pos':'neg')+'">'+esc(k.status)+'</td><td>'+new Date(k.verified_at||k.created_at).toLocaleString()+'</td><td><button onclick="delKey('+Number(k.id)+')" style="width:auto;padding:4px 12px;font-size:10px;border-color:var(--red);color:var(--red)">DELETE</button></td></tr>').join('')+'</tbody></table>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function demoOrderTest(){
  const status=document.getElementById('demoOrderStatus'), button=document.getElementById('demoOrderTest');
  const rows=await api('/keys'); const key=rows?.find(k=>k.exchange==='binanceTestnet'&&k.status==='connected');
  if(!key){status.style.color='var(--red)';status.textContent='No verified Binance Demo connection';return;}
  button.disabled=true; status.style.color='var(--muted)'; status.textContent='Reading BTCUSDT price...';
  try {
    const ticker=await api('/chart/tickers'); const market=Number(ticker.prices.BTCUSDT); const price=Number((market*0.9).toFixed(1));
    const order=await api('/binance-demo/order',{method:'POST',body:JSON.stringify({keyId:key.id,symbol:'BTCUSDT',side:'BUY',quantity:0.001,price})});
    if(!order?.ok) throw new Error(order?.error||order?.exchangeResponse?.msg||'Order failed');
    const orderId=order.exchangeResponse?.orderId; if(!orderId) throw new Error('No order ID returned');
    status.textContent=`Order ${orderId} accepted at ${price}. Canceling...`;
    const cancel=await api('/binance-demo/cancel',{method:'POST',body:JSON.stringify({keyId:key.id,symbol:'BTCUSDT',orderId})});
    if(!cancel?.ok) throw new Error(cancel?.error||cancel?.exchangeResponse?.msg||'Cancel failed');
    status.style.color='var(--emerald)'; status.textContent=`PASS · order ${orderId} canceled · BTCUSDT BUY 0.001 @ ${price}`;
  } catch(e) { status.style.color='var(--red)'; status.textContent=`FAILED · ${e.message}`; }
  finally { button.disabled=false; }
}
async function delKey(id){await api('/keys/'+id,{method:'DELETE'});loadKeys();}
async function logout(){await api('/logout',{method:'POST'});location.href='/';}init();
</script></body></html>
