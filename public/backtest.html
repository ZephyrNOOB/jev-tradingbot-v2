<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JEV - Backtest</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="layout"><aside class="sidebar"><div class="sidebar-brand">JEV<span class="emerald">.</span>BOT</div><nav class="sidebar-nav"><a class="nav-item" href="/dashboard.html">Dashboard</a><a class="nav-item" href="/ablation.html">Strategy Ablation</a><a class="nav-item active" href="/backtest.html">Backtest</a><a class="nav-item" href="/history.html">Trade History</a></nav><div class="sidebar-footer"><button onclick="logout()">LOGOUT</button></div></aside>
<main class="main"><div class="page-header"><h2 class="page-title">BACKTEST ENGINE</h2><span id="userInfo" style="font-family:var(--mono);font-size:12px;color:var(--muted)"></span></div>
<div class="card"><h3 style="font-size:14px;margin-bottom:14px">DATA & STRATEGY CONFIG</h3><div class="form-row">
<div class="field"><label>Exchange</label><select id="exchange" onchange="defaults()"><option value="okx">OKX Perpetual</option><option value="binance">Binance Futures</option></select></div>
<div class="field"><label>Symbol</label><input id="symbol" value="BTC-USDT-SWAP"></div><div class="field"><label>Timeframe</label><select id="timeframe"><option>5m</option><option selected>15m</option><option>1H</option><option>4H</option><option>1d</option></select></div><div class="field"><label>Candles</label><input id="limit" type="number" value="1000" min="100" max="5000"></div></div>
<div class="form-row" style="margin-top:12px"><div class="field"><label>Initial Balance</label><input id="initialBalance" type="number" value="1000"></div><div class="field"><label>Position Size</label><input id="positionSize" type="number" value="1000"></div><div class="field"><label>Fee (bps)</label><input id="feeBps" type="number" value="5" step="0.1"></div><div class="field"><label>Slippage (bps)</label><input id="slippageBps" type="number" value="2" step="0.1"></div><div class="field"><label>EMA Fast / Slow</label><div style="display:flex;gap:6px"><input id="fast" type="number" value="9"><input id="slow" type="number" value="21"></div></div><button onclick="runBacktest()" style="height:38px;margin-top:auto">RUN BACKTEST</button></div><p id="status" style="font:11px var(--mono);color:var(--muted);margin-top:12px">Baseline engine: EMA crossover. Strategy module will be replaceable.</p></div>
<div id="results" class="hidden"><div class="card-grid" id="metrics"></div><div class="card"><h3 style="font-size:14px;margin-bottom:12px">EQUITY CURVE</h3><div id="equity" class="equity-chart"></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="font-size:14px">TRADE RESULTS</h3><button onclick="downloadResult()" style="width:auto;padding:6px 12px">EXPORT JSON</button></div><div class="table-wrap"><table><thead><tr><th>Side</th><th>Entry</th><th>Exit</th><th>Gross PnL</th><th>Fee</th><th>Slippage</th><th>Net PnL</th><th>Reason</th></tr></thead><tbody id="tradeBody"></tbody></table></div></div></div>
</main></div>
<script>
let lastResult=null;
function csrfToken(){return document.cookie.split('; ').find(x=>x.startsWith('csrf='))?.split('=')[1]||'';}
async function api(path,opts={}){const headers={'Content-Type':'application/json',...(opts.headers||{})};if(opts.method&&opts.method!=='GET')headers['x-csrf-token']=csrfToken();const r=await fetch('/api'+path,{...opts,headers});if(r.status===401){location.href='/';return null;}return r.json();}
async function init(){const me=await api('/me');if(me)document.getElementById('userInfo').textContent=me.username;}
function defaults(){const b=document.getElementById('exchange').value==='binance';document.getElementById('symbol').value=b?'BTCUSDT':'BTC-USDT-SWAP';}
function n(v){return Number(v||0)} function money(v){return (v>=0?'+':'')+n(v).toFixed(2)}
async function runBacktest(){const status=document.getElementById('status');status.style.color='var(--muted)';status.textContent='Fetching candles and running engine...';const body={exchange:exchange.value,symbol:symbol.value.trim(),timeframe:timeframe.value,limit:n(limit.value),initialBalance:n(initialBalance.value),positionSize:n(positionSize.value),feeBps:n(feeBps.value),slippageBps:n(slippageBps.value),fast:n(fast.value),slow:n(slow.value)};const r=await api('/backtest/run',{method:'POST',body:JSON.stringify(body)});if(!r||!r.ok){status.style.color='var(--red)';status.textContent=r?.error||'Backtest failed';return;}lastResult=r;status.style.color='var(--emerald)';status.textContent=`Completed: ${r.candles} candles | ${r.engine} | source: ${r.exchange}`;render(r);}
function render(r){results.classList.remove('hidden');const s=r.summary;const cards=[['Net PnL',money(s.netPnl),s.netPnl>=0?'pos':'neg'],['Return',money(s.netPnlPct)+'%',s.netPnlPct>=0?'pos':'neg'],['Trades',s.trades,''],['Win Rate',n(s.winRate).toFixed(1)+'%',''],['Profit Factor',s.profitFactor===Infinity?'∞':n(s.profitFactor).toFixed(2),s.profitFactor>=1?'pos':'neg'],['Max Drawdown',n(s.maxDrawdown).toFixed(2)+'%','neg'],['Final Balance',n(s.finalBalance).toFixed(2),s.finalBalance>=s.initialBalance?'pos':'neg']];metrics.innerHTML=cards.map(x=>`<div class="card"><div class="stat-label">${x[0]}</div><div class="stat-value ${x[2]}">${x[1]}</div></div>`).join('');const vals=r.equity.map(x=>x.value);const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;equity.innerHTML=r.equity.map(x=>`<div class="equity-bar" style="height:${Math.max(4,((x.value-min)/range)*100)}%" title="${new Date(x.ts).toLocaleString()} ${x.value.toFixed(2)}"></div>`).join('');tradeBody.innerHTML=r.trades.map(t=>`<tr><td><span class="badge ${t.side==='LONG'?'badge-long':'badge-short'}">${t.side}</span></td><td>${t.entry.toFixed(2)}</td><td>${t.exit.toFixed(2)}</td><td class="${t.gross>=0?'pos':'neg'}">${money(t.gross)}</td><td class="neg">-${Math.abs(t.fees).toFixed(2)}</td><td class="neg">-${Math.abs(t.slippage).toFixed(2)}</td><td class="${t.net>=0?'pos':'neg'}">${money(t.net)}</td><td>${t.reason}</td></tr>`).join('');}
function downloadResult(){if(!lastResult)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(lastResult,null,2)],{type:'application/json'}));a.download='jev-backtest-'+Date.now()+'.json';a.click();}
async function logout(){await api('/logout',{method:'POST'});location.href='/';}init();
</script></body></html>
